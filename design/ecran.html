<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet – cyp-msbn-zbx</title>
    <style>
         :root {
            --chrome: #202124;
            --surface: #202124;
            --panel: #28292c;
            --panel2: #2d2e31;
            --border: #3c4043;
            --text: #e8eaed;
            --text2: #9aa0a6;
            --blue: #0b57c7;
            --red: #ea4335;
            --red-dark: #933218;
            --red-pill: #f6b9ad;
            --btn: #333438;
            --radius: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        
        html,
        body {
            height: 100%
        }
        
        body {
            font-family: Roboto, "Segoe UI", Arial, sans-serif;
            background: #5f6368;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: auto;
        }
        /* ===== Fausse fenêtre navigateur ===== */
        
        .browser {
            width: min(1720px, 100%);
            height: min(880px, calc(100vh - 48px));
            background: #e8eaed;
            border-radius: 20px;
            padding: 12px;
            display: flex;
        }
        
        .app {
            flex: 1;
            background: var(--surface);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
        }
        /* ===== Barre d'adresse ===== */
        
        .urlbar {
            height: 52px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            background: var(--chrome);
            border-bottom: 1px solid #17181a;
        }
        
        .urlbar .nav {
            display: flex;
            gap: 16px;
            color: #dadce0
        }
        
        .urlbar .nav svg {
            opacity: .8
        }
        
        .omnibox {
            flex: 1;
            max-width: none;
            height: 36px;
            border-radius: 999px;
            background: #303134;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            color: #dadce0;
            font-size: 14px;
        }
        
        .omnibox .lock {
            opacity: .7
        }
        
        .chat-chip {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #303134;
            border-radius: 999px;
            height: 36px;
            padding: 0 14px 0 6px;
            color: #dadce0;
            font-size: 13px;
            cursor: pointer;
        }
        
        .chat-chip .gem {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a8c7fa, #b69cff 60%, #f8bbd0);
        }
        /* ===== Barre icônes haut droite ===== */
        
        .top-actions {
            position: absolute;
            top: 66px;
            right: 0;
            display: flex;
            gap: 10px;
            padding: 0 18px;
            z-index: 5;
        }
        
        .top-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(60, 64, 67, .9);
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            color: #e8eaed;
            cursor: pointer;
            position: relative;
        }
        
        .top-btn:hover {
            background: #3c4043
        }
        
        .top-btn .badge {
            position: absolute;
            bottom: 2px;
            right: 0;
            background: var(--chrome);
            border: 1px solid var(--border);
            font-size: 12px;
            border-radius: 999px;
            padding: 1px 7px;
        }
        
        .top-btn.blue {
            background: linear-gradient(135deg, #8ab4f8, #a78bfa 70%);
            border: none
        }
        
        .top-btn.blue svg {
            fill: #202124;
            stroke: none
        }
        /* ===== Zone principale ===== */
        
        .content {
            flex: 1;
            display: flex;
            gap: 14px;
            padding: 74px 14px 14px;
            min-height: 0
        }
        /* Scène vidéo */
        
        .stage {
            flex: 1;
            position: relative;
            border-radius: var(--radius);
            background: radial-gradient(ellipse at 45% 40%, #4d6284 0%, #3c4f6d 45%, #2e3c55 100%);
            overflow: hidden;
            min-width: 0;
        }
        
        .stage .mute-corner {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #174ea6;
            display: grid;
            place-items: center;
            color: #fff;
        }
        
        .stage .big-avatar {
            position: absolute;
            top: 50%;
            left: 44%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #e8eaed;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
        }
        
        .stage .big-name {
            position: absolute;
            left: 18px;
            bottom: 16px;
            font-size: 20px;
            color: #fff;
        }
        /* Mini tuile */
        
        .tile {
            position: absolute;
            right: 14px;
            bottom: 14px;
            width: 280px;
            height: 170px;
            border-radius: 12px;
            background: radial-gradient(ellipse at 50% 35%, #7d8c33 0%, #66741f 70%, #57661a 100%);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
        }
        
        .tile .mute-corner {
            width: 32px;
            height: 32px;
            top: 8px;
            right: 8px;
            background: #3c4043
        }
        
        .tile .avatar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #e8eaed;
            overflow: hidden;
        }
        
        .tile .name {
            position: absolute;
            left: 12px;
            bottom: 10px;
            font-size: 14px;
            color: #fff;
        }
        /* Silhouette avatar */
        
        .person {
            width: 100%;
            height: 100%;
            display: block
        }
        /* ===== Panneau People ===== */
        
        .people {
            width: 348px;
            flex: none;
            background: var(--panel);
            border-radius: var(--radius);
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: visible;
        }
        
        .people h2 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 16px
        }
        
        .btn-add {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--blue);
            color: #fff;
            border: none;
            height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 14px;
            align-self: flex-start;
        }
        
        .search {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 44px;
            padding: 0 12px;
            margin-bottom: 18px;
            color: var(--text2);
        }
        
        .search input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
        }
        
        .people .label {
            font-size: 12px;
            color: var(--text2);
            letter-spacing: .4px;
            margin-bottom: 8px
        }
        
        .contributors {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
            font-size: 15px;
            color: #caccce;
            cursor: pointer;
        }
        
        .member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
        }
        
        .member .mini {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            flex: none;
            background: #e8eaed;
            position: relative;
        }
        
        .member .mini.green {
            background: #aecb5e
        }
        
        .member .host-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #f9ab00;
            display: grid;
            place-items: center;
        }
        
        .member .who {
            flex: 1;
            min-width: 0;
            line-height: 1.25
        }
        
        .member .who .n {
            font-size: 14.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }
        
        .member .who .r {
            font-size: 12px;
            color: var(--text2)
        }
        
        .member .acts {
            display: flex;
            gap: 4px;
            color: #caccce
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: none;
            color: #caccce;
            display: grid;
            place-items: center;
            cursor: pointer;
        }
        
        .icon-btn:hover {
            background: #3c4043
        }
        
        .icon-btn.dark {
            background: #5f6368
        }
        /* Menu contextuel ouvert */
        
        .ctx {
            position: absolute;
            right: -60px;
            top: 200px;
            width: 300px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 0;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }
        
        .ctx button {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            background: none;
            border: none;
            color: var(--text);
            font-size: 14.5px;
            padding: 11px 18px;
            cursor: pointer;
            text-align: left;
        }
        
        .ctx button:hover {
            background: #3c4043
        }
        
        .ctx button.sel {
            background: #3c4043
        }
        /* ===== Barre de contrôles ===== */
        
        .controls {
            flex: none;
            height: 96px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
        }
        
        .meeting-id {
            font-size: 18px;
            color: var(--text);
            white-space: nowrap
        }
        
        .ctrl-group {
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .split {
            display: flex;
            align-items: stretch;
            border-radius: 999px;
            overflow: hidden;
            height: 52px;
        }
        
        .split .caret {
            width: 44px;
            background: var(--red-dark);
            color: #f6b9ad;
            display: grid;
            place-items: center;
            border: none;
            cursor: pointer;
        }
        
        .split .main {
            width: 64px;
            background: var(--red-pill);
            color: #5c1f14;
            display: grid;
            place-items: center;
            border: none;
            cursor: pointer;
        }
        
        .round {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--btn);
            border: none;
            color: #e8eaed;
            display: grid;
            place-items: center;
            cursor: pointer;
        }
        
        .round:hover {
            background: #3c4043
        }
        
        .round.hangup {
            background: var(--red);
            color: #fff;
            width: 76px;
            border-radius: 999px
        }
        
        .ctrl-right {
            display: flex;
            gap: 14px;
            color: #e8eaed;
            margin-left: auto
        }
        /* ===== Responsive ===== */
        
        @media (max-width:1200px) {
            .ctx {
                right: 0
            }
        }
        
        @media (max-width:980px) {
            .people {
                display: none
            }
            body {
                padding: 10px
            }
        }
        
        @media (max-width:640px) {
            .meeting-id {
                display: none
            }
            .controls {
                gap: 8px;
                padding: 0 10px
            }
            .ctrl-group {
                gap: 6px
            }
            .round {
                width: 44px;
                height: 44px
            }
            .split {
                height: 44px
            }
            .split .caret {
                width: 34px
            }
            .split .main {
                width: 50px
            }
            .ctrl-right {
                display: none
            }
            .top-actions {
                top: 60px;
                right: 8px;
                gap: 6px
            }
            .top-btn {
                width: 42px;
                height: 42px
            }
            .stage .big-avatar {
                width: 120px;
                height: 120px
            }
            .tile {
                width: 200px;
                height: 120px
            }
        }
    </style>
